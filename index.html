<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="龚子轩 · 智能驾驶研发 / 白帽安全 / 人工智能应用方向个人主页">
<title>龚子轩 · 个人主页</title>

<!-- Google Fonts: Plus Jakarta Sans（异步，不阻塞首屏） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<!-- Font Awesome（音乐播放器图标；异步加载，失败时播放器用内联字符兜底不影响功能） -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>

<!-- Tailwind CSS（CDN 运行时；加载失败时下方内联兜底样式仍可保证可用） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if(window.tailwind){
    tailwind.config = {
      theme:{ extend:{
        fontFamily:{ jakarta:['"Plus Jakarta Sans"','-apple-system','BlinkMacSystemFont','"PingFang SC"','"Microsoft YaHei"','sans-serif'] },
        colors:{ ink:'#030712' }
      }}
    };
  }
</script>

<style>
/* ======= 基础与降级兜底（即使 Tailwind / 字体未加载也可用、绝不白屏） ======= */
:root{--ink:#030712;--cyan:#22d3ee;--cyan-soft:#67e8f9;--indigo:#6366f1;--emerald:#34d399}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:#030712;color:#cbd5e1;
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
::selection{background:var(--cyan);color:#030712}

/* 动态背景：全屏循环视频层（参考 codex.html）+ 光斑/网格作为兜底层 */
.video-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#030712}
.video-bg video{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
.video-bg video.ready{opacity:1}
/* 可读性覆盖层：更轻的暗色遮罩，让背景更明显；正文靠卡片自身毛玻璃保证可读 */
.video-overlay{position:absolute;inset:0;
  background:
    radial-gradient(60vw 60vw at 82% -8%,rgba(99,102,241,.22),transparent 60%),
    radial-gradient(52vw 52vw at -8% 12%,rgba(34,211,238,.18),transparent 60%),
    linear-gradient(180deg,rgba(3,7,18,.45),rgba(3,7,18,.58));
}
/* 兜底光斑（视频未加载/被阻断/降级时可见，避免纯黑白屏）—— 增强可见度 */
.orb{position:fixed;border-radius:50%;filter:blur(130px);z-index:-2;pointer-events:none}
.orb-tl{top:-160px;left:-140px;width:600px;height:600px;background:radial-gradient(circle,rgba(34,211,238,.95),transparent 70%);opacity:.26;animation:orbFloat 22s ease-in-out infinite}
.orb-br{bottom:-180px;right:-140px;width:640px;height:640px;background:radial-gradient(circle,rgba(129,140,248,1),transparent 70%);opacity:.24;animation:orbFloat 26s ease-in-out infinite reverse}
.orb-mid{top:38%;left:46%;width:520px;height:520px;background:radial-gradient(circle,rgba(52,211,153,.7),transparent 70%);opacity:.12;animation:orbFloat 30s ease-in-out infinite}
.grid-tex{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.6;
  background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 100%);
}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-34px)}}

/* 装饰同心圆环（呼应参考站「数字孪生」核心）：右侧背景层，缓慢旋转 + 呼吸脉冲，纯装饰不阻挡交互 */
.deco-rings{position:fixed;top:50%;right:-160px;transform:translateY(-50%);z-index:-2;pointer-events:none;
  width:620px;height:620px;opacity:.5;
  -webkit-mask-image:radial-gradient(circle,#000 55%,transparent 78%);
  mask-image:radial-gradient(circle,#000 55%,transparent 78%)}
.deco-rings svg{width:100%;height:100%;animation:ringSpin 60s linear infinite}
.deco-rings circle{fill:none;stroke:rgba(34,211,238,.22);stroke-width:1}
.deco-rings .r-dash{stroke:rgba(129,140,248,.28);stroke-dasharray:5 12;animation:ringSpinR 45s linear infinite;transform-origin:center}
.deco-rings .r-core{stroke:rgba(52,211,153,.35);animation:ringPulse 6s ease-in-out infinite;transform-origin:center}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes ringSpinR{to{transform:rotate(-360deg)}}
@keyframes ringPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
@media(max-width:900px){.deco-rings{width:420px;height:420px;right:-180px;opacity:.35}}
@media(prefers-reduced-motion:reduce){.deco-rings svg,.deco-rings .r-dash,.deco-rings .r-core{animation:none}}

/* 英雄姓名标题：字符逐个渐入上浮 + 一次性光泽扫过（电影感首屏）
   注意：.metric 的渐变裁剪(background-clip:text)不会向子元素继承，
   因此逐字 span 需各自应用同款渐变裁剪，否则文字会透明不可见。
   基础态设为可见(opacity:1)，动画改为 from 0 渐入——即便动画不触发文字也一定可见，绝不隐身。 */
.hero-name{display:inline-block}
.hero-name .ch{display:inline-block;opacity:1;
  background:linear-gradient(120deg,#22d3ee,#818cf8 55%,#34d399);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%}
.js .hero-name .ch{animation:chIn .6s cubic-bezier(.2,.8,.2,1) both}
.hero-name .ch:not(.sp){padding-right:.01em}   /* 防止部分字体渐变裁剪贴边被切 */
@keyframes chIn{from{opacity:0;transform:translateY(.5em) rotate(4deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.hero-name .ch{opacity:1;transform:none;animation:none}}

/* 顶部滚动进度条 */
#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:200;
  background:linear-gradient(90deg,#22d3ee,#34d399);box-shadow:0 0 12px rgba(34,211,238,.6);
  transition:width .08s linear}

/* ======= 自定义鼠标光标：实心小点 + 缓动延迟外圈（参考 liuhao.online 的「点+圈」设计） =======
   仅在具备精确指针(鼠标)的设备启用；触摸端 / 减动效场景下完全隐藏并恢复系统光标。 */
.cursor-on{cursor:none}
.cursor-on a,.cursor-on button,.cursor-on input,.cursor-on textarea,.cursor-on select,
.cursor-on [role="button"],.cursor-on .copy-btn,.cursor-on label,
/* 图底卡 / 服务卡显式声明了 cursor:pointer，需在自定义光标模式下一并隐藏系统箭头 */
.cursor-on .glass-photo,.cursor-on .svc-card,.cursor-on .glass{cursor:none}
#cursorDot,#cursorRing{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;
  border-radius:50%;transform:translate(-50%,-50%);will-change:transform;mix-blend-mode:normal}
/* 实心小点：精确跟随，青色核心，带柔光 */
#cursorDot{width:7px;height:7px;background:#22d3ee;
  box-shadow:0 0 10px rgba(34,211,238,.9),0 0 4px rgba(34,211,238,.6);
  transition:width .2s ease,height .2s ease,background .2s ease,opacity .3s ease}
/* 空心外圈：缓动延迟跟随（JS lerp），悬停时放大染色 */
#cursorRing{width:36px;height:36px;border:1.5px solid rgba(34,211,238,.55);
  box-shadow:0 0 18px rgba(34,211,238,.18) inset;
  transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),
             border-color .25s ease,background .25s ease,opacity .3s ease}
/* 悬停可交互元素：外圈放大 + 更亮描边 + 极淡填充；小点稍微收缩 */
#cursorRing.hover{width:56px;height:56px;border-color:rgba(103,232,249,.9);
  background:rgba(34,211,238,.08);box-shadow:0 0 26px rgba(34,211,238,.3) inset}
#cursorDot.hover{width:5px;height:5px;background:#67e8f9}
/* 按下：外圈瞬间收缩，产生「咔哒」反馈 */
#cursorRing.down{width:26px;height:26px;border-color:rgba(52,211,153,.9)}
#cursorDot.down{width:10px;height:10px;background:#34d399}
/* 移出窗口时淡出 */
#cursorDot.hidden,#cursorRing.hidden{opacity:0}
/* 浅色主题下换成深色描边，保证在亮底可见 */
.light #cursorDot{background:#0891b2;box-shadow:0 0 10px rgba(8,145,178,.6)}
.light #cursorRing{border-color:rgba(8,145,178,.5)}
.light #cursorRing.hover{border-color:rgba(8,145,178,.85);background:rgba(8,145,178,.08)}
/* 减动效偏好：不显示自定义光标（下方 JS 也会跳过初始化） */
@media(prefers-reduced-motion:reduce){#cursorDot,#cursorRing{display:none!important}}

/* 玻璃卡片（兜底类，Tailwind 未加载时生效）—— 半透明让背景隐约透出，同时保证正文可读 */
.glass{background:rgba(15,23,42,.5);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,.10);border-radius:28px}
/* 卡片鼠标光晕跟随（spotlight）：跟随光标的柔和青色光斑，提升立体高级感。
   由 JS 写入 --sx/--sy(光标在卡片内坐标) 与 --sp(悬停时=1)。默认不占据合成层，不影响性能。 */
.glass{position:relative}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  opacity:var(--sp,0);transition:opacity .35s ease;
  background:radial-gradient(240px 240px at var(--sx,50%) var(--sy,50%),rgba(34,211,238,.14),transparent 60%)}
/* 卡片内容需在光斑之上 */
.glass>*{position:relative;z-index:1}
.light .glass::after{background:radial-gradient(240px 240px at var(--sx,50%) var(--sy,50%),rgba(8,145,178,.12),transparent 60%)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);color:#67e8f9}

/* 渐入：初始 opacity 必须为 1，避免脚本失效白屏；有 JS 时改为 0 再淡入 */
.reveal{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.js .reveal{opacity:0;transform:translateY(26px)}
.js .reveal.in{opacity:1;transform:none}

/* 打字机光标 */
.cursor{display:inline-block;width:2px;height:1em;background:var(--cyan);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 指标数字渐变 */
.metric{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;line-height:1;
  background:linear-gradient(120deg,#22d3ee,#818cf8 55%,#34d399);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* 卡片 hover 上浮 + 青色微光 */
.lift{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.lift:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.35);box-shadow:0 20px 50px -20px rgba(34,211,238,.35)}

/* 按钮辉光 */
.btn-glow{position:relative;transition:transform .2s ease,box-shadow .3s ease}
.btn-glow:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(34,211,238,.4),0 10px 30px -8px rgba(34,211,238,.6)}

/* 顶部悬浮式导航按钮 —— 现代科技·毛玻璃暗黑风，材质跟随下方卡片(.glass) */
/* 颜色变量：默认深色玻璃，随主题自适应 */
:root{
  --nav-face-bg:rgba(15,23,42,.5);--nav-face-bg-hover:rgba(30,41,59,.72);
  --nav-fg:#cbd5e1;--nav-fg-hover:#e0f2fe;
  --nav-border:rgba(255,255,255,.10);--nav-border-hover:rgba(34,211,238,.45);
}
.light{
  --nav-face-bg:rgba(255,255,255,.55);--nav-face-bg-hover:rgba(255,255,255,.8);
  --nav-fg:#334155;--nav-fg-hover:#0b1220;
  --nav-border:rgba(15,23,42,.12);--nav-border-hover:rgba(34,211,238,.55);
}
.nav-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  height:36px;min-width:64px;padding:0 14px;border-radius:12px;cursor:pointer;text-decoration:none;
  overflow:hidden;transition:transform .3s ease,box-shadow .3s ease;
}
.nav-btn .nav-face{ /* 毛玻璃前景面：与卡片同款材质 */
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;border-radius:12px;
  font-size:13.5px;font-weight:700;letter-spacing:.28em;text-indent:.28em;color:var(--nav-fg);
  background:var(--nav-face-bg);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--nav-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:all .3s;
}
.nav-btn .nav-bg{ /* 背后极淡的青→紫辉光，悬停时隐约透出，保持暗黑质感 */
  position:absolute;inset:0;z-index:0;border-radius:11px;pointer-events:none;opacity:0;
  background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(99,102,241,.28));
  transition:opacity .3s ease;
}
.nav-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(34,211,238,.55)}
.nav-btn:hover .nav-bg{opacity:1}
.nav-btn:hover .nav-face{background:var(--nav-face-bg-hover);border-color:var(--nav-border-hover);color:var(--nav-fg-hover)}
.nav-btn:focus-visible{outline:2px solid rgba(34,211,238,.6);outline-offset:3px}
/* 当前所在区块高亮：青色描边 + 辉光常驻 */
.nav-btn.active .nav-face{color:var(--nav-fg-hover);border-color:rgba(34,211,238,.5);background:var(--nav-face-bg-hover)}
.nav-btn.active .nav-bg{opacity:.6}

/* 科技感悬浮式「点击复制」联系方式按钮 */
.copy-btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  padding:10px 15px;border-radius:14px;font-family:inherit;color:#cbd5e1;
  background:linear-gradient(180deg,rgba(30,41,59,.55),rgba(15,23,42,.55));
  border:1px solid rgba(148,163,184,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,border-color .28s ease,background .28s ease;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.copy-btn::before{ /* 悬停扫光 */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(120px 60px at var(--mx,50%) var(--my,50%),rgba(34,211,238,.22),transparent 70%);
  transition:opacity .3s ease;
}
.copy-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(34,211,238,.45);
  box-shadow:0 0 0 1px rgba(34,211,238,.35),0 16px 36px -14px rgba(34,211,238,.7);
}
.copy-btn:hover::before{opacity:1}
.copy-btn:active{transform:translateY(-1px) scale(.98)}
.copy-btn .cb-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#67e8f9;
  background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);transition:.28s}
.copy-btn:hover .cb-ic{color:#030712;background:linear-gradient(135deg,#22d3ee,#34d399);border-color:transparent}
.copy-btn .cb-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.copy-btn .cb-k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;font-weight:700}
.copy-btn .cb-v{font-size:13.5px;font-weight:700;color:#e2e8f0}
.copy-btn .cb-act{display:grid;place-items:center;color:#64748b;transition:.28s;margin-left:2px}
.copy-btn:hover .cb-act{color:#22d3ee;transform:scale(1.1)}
.copy-btn.copied{border-color:rgba(52,211,153,.6);box-shadow:0 0 0 1px rgba(52,211,153,.5),0 16px 36px -14px rgba(52,211,153,.6)}
.copy-btn.copied .cb-ic{color:#030712;background:linear-gradient(135deg,#34d399,#22d3ee);border-color:transparent}
.copy-btn.copied .cb-act{color:#34d399}
@media(max-width:480px){.copy-btn{flex:1 1 100%}}

/* 页脚点赞按钮（颜色跟随背景/主题；计数本地持久化，便于日后接后端） */
.like-btn{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:inherit;
  padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;color:#cbd5e1;
  background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.18);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,border-color .25s ease,color .25s ease,background .25s ease;
  -webkit-tap-highlight-color:transparent}
.like-btn:hover{transform:translateY(-2px);border-color:rgba(244,114,182,.5);color:#fda4d3;
  box-shadow:0 0 0 1px rgba(244,114,182,.28),0 14px 30px -14px rgba(244,114,182,.6)}
.like-btn .like-ic{display:grid;place-items:center;width:18px;height:18px;color:#94a3b8;transition:.25s}
.like-btn .like-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}
.like-btn:hover .like-ic{color:#f472b6}
.like-btn .like-count{min-width:20px;padding:0 7px;height:19px;display:inline-grid;place-items:center;
  font-size:11.5px;border-radius:999px;background:rgba(148,163,184,.16);color:#cbd5e1;transition:.25s}
/* 已点赞态：心形填充为粉红并保持高亮 */
.like-btn.liked{color:#f9a8d4;border-color:rgba(244,114,182,.55);background:rgba(244,114,182,.10)}
.like-btn.liked .like-ic{color:#f472b6}
.like-btn.liked .like-ic svg{fill:#f472b6;stroke:#f472b6}
.like-btn.liked .like-count{background:rgba(244,114,182,.22);color:#fbcfe8}
.like-btn.pop .like-ic{animation:likePop .45s ease}
@keyframes likePop{0%{transform:scale(1)}35%{transform:scale(1.4)}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* 时间线 */
.tl-dot{position:relative}
.tl-dot::before{content:"";position:absolute;left:-21px;top:7px;width:11px;height:11px;border-radius:50%;
  background:#030712;border:3px solid var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.7)}

/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120%);z-index:300;
  background:rgba(15,23,42,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(34,211,238,.3);color:#e2e8f0;padding:12px 20px;border-radius:16px;
  font-size:14px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  display:flex;align-items:center;gap:9px;max-width:88vw}
#toast.show{transform:translate(-50%,0)}

/* 灯箱 */
#lightbox{position:fixed;inset:0;z-index:400;display:none;place-items:center;padding:22px;cursor:zoom-out;
  background:rgba(2,6,18,.9);backdrop-filter:blur(6px)}
#lightbox.open{display:grid}
#lightbox img{max-width:94vw;max-height:88vh;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.7)}

/* 圆圈 + 黑点 滚动导航图标（极简风，带圆周进度） */
.scroll-icon{
  position:fixed;right:30px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:150;
  width:40px;height:40px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:none;padding:0;-webkit-tap-highlight-color:transparent;
  opacity:1;transition:transform .3s ease,opacity .3s ease;
}
.scroll-icon .si-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.scroll-icon .si-track{fill:none;stroke:var(--ring-color,#333);stroke-width:2;transition:stroke .3s ease}
.scroll-icon .si-prog{fill:none;stroke:var(--prog-color,#22d3ee);stroke-width:2;stroke-linecap:round;
  stroke-dasharray:125.66;stroke-dashoffset:125.66;transition:stroke-dashoffset .1s linear,stroke .3s ease}
.scroll-icon .si-dot{width:8px;height:8px;border-radius:50%;background:var(--dot-color,#0b1220);
  transition:width .3s ease,height .3s ease,background .3s ease}
.scroll-icon:hover{transform:translateY(-2px)}
.scroll-icon:hover .si-track{stroke:var(--ring-hover,#8899b0)}
.scroll-icon:hover .si-dot{width:10px;height:10px}
.scroll-icon:focus-visible{outline:2px solid rgba(34,211,238,.6);outline-offset:4px;border-radius:50%}
/* 到底部后翻转为「返回顶部」语义：内点变亮青色 */
.scroll-icon.at-end .si-dot{background:#22d3ee}
/* 深色主题（本站默认）：外圈偏亮灰、内点偏亮以在暗底可见 */
:root{--ring-color:rgba(148,163,184,.5);--ring-hover:#cbd5e1;--dot-color:#e2e8f0;--prog-color:#22d3ee}
/* 浅色主题：黑色边框 + 深色内点（配合下方 .light 主题切换） */
.light .scroll-icon{--ring-color:#333;--ring-hover:#000;--dot-color:#111}
@media(max-width:768px){
  .scroll-icon{right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:30px;height:30px}
  .scroll-icon .si-dot{width:6px;height:6px}
  .scroll-icon:hover .si-dot{width:8px;height:8px}
}

/* ======================= 音乐播放器（深色星空·毛玻璃，材质跟随卡片） ======================= */
/* 容器：固定右下角；小屏底部居中。层级低于滚动图标但高于内容。容器本身透明，材质在 fab/panel 上 */
#player{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:160;
  color:#e2e8f0;font-size:13px;
}
/* —— 收起态：悬浮式圆形音乐按钮（经典音乐图标） —— */
.pl-fab{
  position:relative;width:52px;height:52px;border:none;border-radius:50%;cursor:pointer;padding:0;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;
  /* 材质与卡片一致 */
  background:rgba(15,23,42,.6);backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  color:#67e8f9;transition:transform .3s ease,box-shadow .3s ease,color .2s,background .2s;
}
.pl-fab:hover{transform:translateY(-2px);color:#e0f2fe;
  box-shadow:0 16px 36px rgba(0,0,0,.5),0 0 0 1px rgba(34,211,238,.4),0 0 22px rgba(34,211,238,.35)}
.pl-fab:focus-visible{outline:2px solid rgba(34,211,238,.7);outline-offset:3px}
.pl-fab-ic{font-size:19px;transition:opacity .2s}
/* 外圈脉冲光环（仅播放时显现） */
.pl-fab-ring{position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(34,211,238,.5);opacity:0;pointer-events:none}
#player.playing .pl-fab-ring{animation:plPulse 1.8s ease-out infinite}
@keyframes plPulse{0%{opacity:.55;transform:scale(1)}70%{opacity:0;transform:scale(1.5)}100%{opacity:0;transform:scale(1.5)}}
/* 播放时把音符换成跳动的均衡器 */
.pl-fab-eq{position:absolute;display:none;align-items:flex-end;gap:2.5px;height:16px}
.pl-fab-eq span{width:3px;height:5px;background:currentColor;border-radius:2px;animation:plEq .9s ease-in-out infinite}
.pl-fab-eq span:nth-child(2){animation-delay:.25s}
.pl-fab-eq span:nth-child(3){animation-delay:.5s}
@keyframes plEq{0%,100%{height:5px}50%{height:15px}}
#player.playing .pl-fab-ic{opacity:0}
#player.playing .pl-fab-eq{display:flex}
/* 展开后隐藏 fab，显示面板 */
#player.expanded .pl-fab{display:none}
.pl-panel{
  display:none;width:300px;max-width:calc(100vw - 40px);padding:15px;border-radius:16px;
  background:rgba(15,23,42,.6);backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  transform-origin:bottom right;animation:plPanelIn .25s cubic-bezier(.2,.8,.2,1);
}
#player.expanded .pl-panel{display:block}
@keyframes plPanelIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* 收起按钮（面板内） */
.pl-btn.pl-min{width:34px;height:34px;font-size:12px}
/* 顶部：当前曲名（点击展开列表） */
.pl-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.pl-head .pl-cover{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(34,211,238,.9),rgba(99,102,241,.9));color:#04121f;font-size:15px}
.pl-head .pl-cover.spinning{animation:plSpin 6s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
.pl-meta{min-width:0;flex:1 1 auto}
.pl-title{font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.pl-sub{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-caret{flex:0 0 auto;color:#94a3b8;transition:transform .3s ease}
#player.open .pl-caret{transform:rotate(180deg)}
/* 下拉播放列表 */
.pl-list{list-style:none;margin:0;padding:0;max-height:0;overflow:hidden auto;opacity:0;
  transition:max-height .3s ease,opacity .3s ease,margin .3s ease;
  border-radius:9px;background:rgba(0,0,0,.55)}
#player.open .pl-list{max-height:200px;opacity:1;margin:12px 0 4px;
  border:1px solid rgba(255,255,255,.08)}
.pl-list li{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;color:#cbd5e1;
  border-bottom:1px solid rgba(255,255,255,.05);transition:background .2s,color .2s}
.pl-list li:last-child{border-bottom:none}
.pl-list li:hover{background:rgba(34,211,238,.12);color:#e0f2fe}
.pl-list li.active{background:rgba(34,211,238,.16);color:#67e8f9;font-weight:600}
.pl-list li .idx{width:16px;text-align:center;font-size:11px;color:#64748b}
.pl-list li.active .idx{color:#22d3ee}
.pl-list li .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 空音乐库占位行：不可点击、弱化配色 */
.pl-list li.pl-empty{cursor:default;color:#64748b;font-style:italic}
.pl-list li.pl-empty:hover{background:transparent;color:#64748b}
.pl-list li.pl-empty .idx{color:#475569}
/* 进度条 + 时间 */
.pl-progwrap{margin-top:12px;display:flex;align-items:center;gap:9px}
.pl-time{font-size:10.5px;color:#94a3b8;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
/* 用 range 承载可拖动，用 progress 做视觉底；这里以 range 为主，样式化为进度条 */
.pl-seek{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:5px;border-radius:999px;cursor:pointer;
  background:linear-gradient(to right,var(--seek,#22d3ee) 0%,var(--seek,#22d3ee) var(--pct,0%),rgba(255,255,255,.14) var(--pct,0%));
  outline:none}
.pl-seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#e0f2fe;box-shadow:0 0 8px rgba(34,211,238,.8);cursor:pointer;transition:transform .15s}
.pl-seek::-webkit-slider-thumb:hover{transform:scale(1.2)}
.pl-seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#e0f2fe;
  box-shadow:0 0 8px rgba(34,211,238,.8);cursor:pointer}
/* 控制区 */
.pl-controls{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:10px}
.pl-btn{width:40px;height:40px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:#e2e8f0;font-size:15px;transition:background .2s,color .2s,transform .2s}
.pl-btn:hover{background:#fff;color:#0b1220;transform:translateY(-1px)}
.pl-btn.pl-play{width:46px;height:46px;font-size:17px;
  background:linear-gradient(135deg,rgba(34,211,238,.9),rgba(99,102,241,.9));color:#04121f}
.pl-btn.pl-play:hover{background:#fff;color:#0b1220}
.pl-btn:focus-visible{outline:2px solid rgba(34,211,238,.7);outline-offset:2px}
/* 音量 */
.pl-vol{margin-top:12px;display:flex;align-items:center;gap:9px;color:#94a3b8}
.pl-vol i,.pl-vol .vico{width:16px;text-align:center;font-size:13px}
.pl-volrange{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:4px;border-radius:999px;cursor:pointer;
  background:linear-gradient(to right,#94a3b8 0%,#94a3b8 var(--vpct,80%),rgba(255,255,255,.12) var(--vpct,80%));outline:none}
.pl-volrange::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#cbd5e1;cursor:pointer}
.pl-volrange::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:#cbd5e1;cursor:pointer}
/* 浅色主题适配 */
.light .pl-fab{background:rgba(255,255,255,.72);border-color:rgba(15,23,42,.12);color:#0369a1}
.light .pl-fab:hover{color:#0b1220}
.light .pl-panel{background:rgba(255,255,255,.8);border-color:rgba(15,23,42,.12);color:#1e293b}
.light .pl-title{color:#0b1220}.light .pl-list{background:rgba(255,255,255,.9)}
.light .pl-list li{color:#334155;border-color:rgba(15,23,42,.06)}
.light .pl-btn{background:rgba(15,23,42,.08);color:#1e293b}
.light .pl-btn:hover{background:#0b1220;color:#fff}
/* 小屏：底部居中，宽度自适应；触控友好 */
@media(max-width:768px){
  #player{left:50%;right:auto;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom))}
  .pl-fab{width:48px;height:48px}
  .pl-panel{width:min(360px,calc(100vw - 28px));padding:14px}
}
/* 打印时隐藏播放器 */
@media print{#player{display:none!important}}
/* 减动效偏好：关闭封面旋转与动画 */
@media(prefers-reduced-motion:reduce){
  .pl-head .pl-cover.spinning{animation:none}
  .pl-fab-eq span,.pl-fab-ring{animation:none!important}
  .pl-panel{animation:none}
}

/* Bento 兜底栅格（Tailwind 缺失时保证不塌） */
.bento{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.bento{grid-template-columns:repeat(3,1fr)}
  .col-2{grid-column:span 2}.col-3{grid-column:span 3}.row-2{grid-row:span 2}}

/* ======================= 锯齿错位排列（左右交替，Z 字节奏，留白优雅） =======================
   .zig 容器内每张卡约占 62% 宽度：奇数卡靠左、偶数卡靠右并下移错位，形成左右摆动的视觉节奏。
   小屏自动回退为单列全宽，保证可读与不塌。 */
.zig{display:flex;flex-direction:column;gap:22px}
.zig>*{width:100%}
@media(min-width:900px){
  .zig{gap:34px}
  .zig>*{width:62%}
  .zig>*:nth-child(odd){align-self:flex-start;margin-right:auto}   /* 靠左 */
  .zig>*:nth-child(even){align-self:flex-end;margin-left:auto;margin-top:-46px}   /* 靠右并上提错位，形成咬合 */
  /* 宽内容卡（经历时间轴等）可用 .zig-wide 占满整行，避免横向拥挤 */
  .zig>.zig-wide{width:100%;margin:0!important;align-self:stretch}
}
/* 减动效/窄屏不做负边距错位 */
@media(max-width:899px){.zig>*{margin:0!important}}

.vt-glare{border-radius:28px!important}

/* ======================= SERVICES 技能站（参考图：暗色影院风 · 左极简字 · 右图卡片） ======================= */
.svc{position:relative}
.svc-grid{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:1000px){.svc-grid{grid-template-columns:300px 1fr;gap:40px;align-items:start}}
/* ---- 左侧极简标题栏 ---- */
.svc-left{position:relative;padding-top:6px}
@media(min-width:1000px){.svc-left{position:sticky;top:96px}}
.svc-index{position:absolute;top:-4px;right:0;font-size:13px;font-weight:700;letter-spacing:.3em;color:#475569}
.svc-heading{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;letter-spacing:.14em;
  font-size:clamp(34px,5vw,52px);line-height:1;color:#e2e8f0;margin:0}
.svc-vlabel{writing-mode:vertical-rl;position:absolute;left:-2px;top:82px;font-size:10.5px;letter-spacing:.35em;
  color:#64748b;font-weight:700;text-transform:uppercase}
.svc-sub{margin:22px 0 0 26px;color:#94a3b8;font-size:14px;line-height:1.9;font-weight:500}

  animation:blink 1s steps(1) infinite}
.svc-nums{margin:34px 0 0 26px;display:flex;flex-direction:column;gap:14px}
.svc-nums span{font-size:12px;font-weight:700;letter-spacing:.2em;color:#334155;transition:color .3s,transform .3s}

/* ---- 右侧卡片容器：横向并排，可在窄屏堆叠 ---- */
.svc-cards{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:640px){.svc-cards{grid-template-columns:1fr 1fr}}
/* ---- 单张服务卡：竖长比例、图片背景 + 暗色遮罩 + 悬浮交互 ---- */
.svc-card{position:relative;overflow:hidden;border-radius:22px;min-height:420px;

  background:linear-gradient(180deg,rgba(15,23,42,.15) 0%,rgba(15,23,42,.55) 45%,rgba(15,23,42,.90) 100%)}
.svc-card-no{position:absolute;top:16px;right:20px;z-index:2;font-size:clamp(40px,6vw,64px);font-weight:800;
  line-height:1;color:rgba(255,255,255,.10);letter-spacing:.02em;transition:color .4s ease}
.svc-card-body{position:relative;z-index:2;padding:24px 22px 22px}
.svc-card-title{font-size:22px;font-weight:800;color:#fff;margin:0 0 12px;letter-spacing:.01em}
.svc-card-desc{font-size:13px;line-height:1.85;color:#cbd5e1;margin:0;max-width:34ch}
.svc-card-tags{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);

.svc-card-tags i{color:#475569;font-style:normal;margin:0 2px}
.svc-card-tags b{color:#475569;font-weight:700;margin:0 3px}

/* 悬浮交互：卡片上浮、图片放大提亮、编号点亮、青色描边与辉光 */
.svc-card:hover{transform:translateY(-10px);border-color:rgba(34,211,238,.5);

/* ======================= 图片背景卡（把普通卡升级为 SERVICES 同款：图底 + 暗色遮罩 + 悬浮交互） =======================
   用法：给 .glass 卡追加 .glass-photo，并注入 .gp-img / .gp-shade / .gp-glow 三层（在内容之下）。
   内容仍在最上层，暗色遮罩保证正文可读；hover 时图片放大提亮、青描边与底部辉光，观感与技能站一致。 */
.glass-photo{position:relative;isolation:isolate;overflow:hidden;cursor:pointer;
  border:1px solid rgba(255,255,255,.10);
  /* 颜色还原为与个人名片 .glass 相同的板岩蓝 rgba(15,23,42,..)，仅换色不改结构 */
  background:linear-gradient(160deg,rgba(15,23,42,.55),rgba(15,23,42,.62))}
.glass-photo .gp-img{position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center;
  transform:scale(1.05);filter:brightness(.5) saturate(1.05);
  transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .5s ease}
.glass-photo .gp-shade{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,23,42,.30) 0%,rgba(15,23,42,.58) 42%,rgba(15,23,42,.86) 100%)}
.glass-photo .gp-glow{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;
  background:radial-gradient(65% 55% at 50% 100%,rgba(34,211,238,.26),transparent 72%);transition:opacity .5s ease}
/* 内容层置于三层背景之上（.glass>* 已 z-index:1，这里明确抬升，::before 顶缘高光继续生效） */
.glass-photo>*:not(.gp-img):not(.gp-shade):not(.gp-glow){position:relative;z-index:2}
/* 悬浮交互：图片放大提亮 + 底部青色辉光（上浮沿用 .lift；描边这里加强） */
.glass-photo:hover .gp-img{transform:scale(1.12);filter:brightness(.56) saturate(1.15)}
.glass-photo:hover .gp-glow{opacity:1}
.glass-photo.lift:hover{border-color:rgba(34,211,238,.42);
  box-shadow:0 28px 66px -26px rgba(0,0,0,.95),0 0 0 1px rgba(34,211,238,.2),0 20px 50px -22px rgba(34,211,238,.4)}
.glass-photo:focus-visible{outline:2px solid rgba(34,211,238,.6);outline-offset:3px}
/* 浅色主题：遮罩减淡、图片提亮，保持可读 */

.flag-hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;

@keyframes flagUp{to{opacity:1;transform:none}}

/* 姓名逐字动画兜底：动画预计结束后强制锁定可见态，避免个别环境 animation-fill 不生效导致文字隐身 */
(function ensureHeroName(){
  const chars = document.querySelectorAll(".hero-name .ch");
  if(!chars.length) return;
  const lock = ()=>chars.forEach(c=>{ c.style.opacity="1"; c.style.transform="none"; });
  // 最后一个字符动画结束即锁定；同时设总兜底定时器（延迟递增 + 时长，留足余量）
  chars.forEach(c=>c.addEventListener("animationend",lock,{once:true}));
  setTimeout(lock, 300 + chars.length*80 + 800);
})();

  // 省流 / 慢网 / 减动效：不加载视频，保留下方动态光斑背景（省流量、避免卡顿）。

  // iOS/部分安卓：自动播放被拦时，用户首次触摸/点击后再补一次播放
  const resume = ()=>{ video.play?.().then(()=>video.classList.add("ready")).catch(()=>{}); };

  // 标签页隐藏时暂停，回到前台恢复，节省资源

/* ---- 轻量原生 Canvas Confetti ---- */
const cvs=$("#confetti"),ctx=cvs.getContext("2d");let parts=[],raf=null;
function fit(){cvs.width=innerWidth*devicePixelRatio;cvs.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
fit(); addEventListener("resize",fit,{passive:true});
function confettiBurst(x,y){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const colors=["#22d3ee","#34d399","#818cf8","#f472b6","#fbbf24"];
  for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.18,life:60+Math.random()*30,
      c:colors[i%colors.length],s:5+Math.random()*5,rot:Math.random()*6.28,vr:(-.3+Math.random()*.6)});}
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life/60);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
  if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,innerWidth,innerHeight);}
}

/* ================= 音乐播放器 ================= */
/* ============================================================
   🎵 音乐库：把 mp3 直接丢进仓库的 music/ 文件夹即可自动上架
   ------------------------------------------------------------
   加载优先级（任一步失败自动回退下一步，播放器永不崩）：
     1) GitHub Contents API 自动列出 music/ 下所有音频 —— 上传新歌即自动显示
     2) music/music.json 清单（本地预览 / 想手动排序时用）
     3) 下方内置示例列表（最终兜底）
   部署在 GitHub Pages（*.github.io）时自动识别本仓库，零配置。
   若部署在别处，请在 MUSIC_CONFIG 手动填 owner / repo。 */
const MUSIC_CONFIG = {
  owner: "",            // ← 部署到非 GitHub Pages 时填你的 GitHub 用户名，例如 "GongZixuan"
  repo:  "",            // ← 以及仓库名，例如 "resume"；GitHub Pages 上留空即可自动识别
  branch:"main",        // 分支名（默认 main，若你的默认分支是 master 请改这里）
  dir:   "music"        // 音频所在文件夹
};
/* 内置示例列表（第 3 兜底）；正式使用时可保留或清空 */
const fallbackPlaylist = [
  { title:"星轨 Starlight",   artist:"AI 生成 · 氛围", src:"music/starlight.mp3" },
  { title:"夜航 Night Drive", artist:"AI 生成 · 电子", src:"music/night-drive.mp3" },
  { title:"归零 Reset",        artist:"AI 生成 · 国风", src:"music/reset.mp3" }
];

/* playlist 先给兜底，异步解析成功后由 setPlaylist() 替换并重渲染 */
let playlist = fallbackPlaylist.slice();

const AUDIO_EXT = /\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|weba)$/i;
/* 文件名 → {title, artist}：去扩展名 + 解码 URL；用 " - " 分隔「歌名 - 风格/艺术家」 */
function parseTrackName(filename){
  let base = decodeURIComponent(filename).replace(AUDIO_EXT,"").trim();
  base = base.replace(/^\d+[\s._-]+/,"");          // 去掉开头的序号前缀（如 "01 "、"1_"）
  const parts = base.split(/\s+-\s+/);
  if(parts.length >= 2) return { title: parts[0].trim(), artist: parts.slice(1).join(" - ").trim() };
  return { title: base, artist: "" };
}
/* 自动识别 GitHub Pages 上的 owner/repo（user.github.io 或 user.github.io/repo/） */
function detectGitHubRepo(){
  if(MUSIC_CONFIG.owner && MUSIC_CONFIG.repo) return { owner:MUSIC_CONFIG.owner, repo:MUSIC_CONFIG.repo };
  const host = location.hostname, m = host.match(/^([^.]+)\.github\.io$/i);
  if(!m) return null;
  const owner = m[1];
  const seg = location.pathname.split("/").filter(Boolean);
  // 项目页：user.github.io/<repo>/...  用户主页：user.github.io → 仓库即 <user>.github.io
  const repo = seg.length ? seg[0] : `${owner}.github.io`;
  return { owner, repo };
}
/* 通过 GitHub Contents API 列出 music/ 下的音频文件 */
async function fetchFromGitHub(){
  const gh = detectGitHubRepo();
  if(!gh) return null;
  const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${MUSIC_CONFIG.dir}?ref=${MUSIC_CONFIG.branch}`;
  const res = await fetch(url,{ headers:{ "Accept":"application/vnd.github+json" } });
  if(!res.ok) throw new Error("GitHub API "+res.status);
  const files = await res.json();
  if(!Array.isArray(files)) return null;
  return files
    .filter(f => f.type==="file" && AUDIO_EXT.test(f.name))
    .sort((a,b)=>a.name.localeCompare(b.name,"zh"))
    .map(f => ({ ...parseTrackName(f.name), src: f.download_url || `${MUSIC_CONFIG.dir}/${encodeURIComponent(f.name)}` }));
}
/* 读取 music/music.json 清单 */
async function fetchFromManifest(){
  const res = await fetch(`${MUSIC_CONFIG.dir}/music.json`,{ cache:"no-store" });
  if(!res.ok) throw new Error("manifest "+res.status);
  const data = await res.json();
  const arr = Array.isArray(data) ? data : (data.tracks||[]);
  if(!arr.length) return null;
  return arr.map(t => ({
    title: t.title || parseTrackName(t.src||"未命名").title,
    artist: t.artist || "",
    // 清单里的 src 若是裸文件名，则补上 music/ 前缀
    src: /^(https?:)?\/\//.test(t.src) || t.src.includes("/") ? t.src : `${MUSIC_CONFIG.dir}/${t.src}`
  }));
}

(function initPlayer(){
  const player=$("#player"), audio=$("#plAudio");
  if(!player||!audio) return;
  const head=$("#plHead"), listEl=$("#plList"), titleEl=$("#plTitle"), subEl=$("#plSub"),
        cover=$("#plCover"), toggle=$("#plToggle"), toggleIcon=$("#plToggleIcon"),
        prevBtn=$("#plPrev"), nextBtn=$("#plNext"), seek=$("#plSeek"),
        curEl=$("#plCur"), durEl=$("#plDur"), vol=$("#plVol"), volIcon=$("#plVolIcon"),
        fab=$("#plFab"), collapseBtn=$("#plCollapse");
  let idx=0, seeking=false, errCount=0;

  const fmt=s=>{ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

  // 渲染播放列表（空库时给出友好提示）
  function renderList(){
    listEl.innerHTML="";
    if(!playlist.length){
      const li=document.createElement("li");
      li.className="pl-empty"; li.setAttribute("aria-disabled","true");
      li.innerHTML=`<span class="idx"><i class="fa-solid fa-compact-disc"></i></span><span class="nm">音乐库为空 · 敬请期待新作品</span>`;
      listEl.appendChild(li);
      return;
    }
    playlist.forEach((t,i)=>{
      const li=document.createElement("li");
      li.setAttribute("role","option");
      li.className=(i===idx?"active":"");
      li.innerHTML=`<span class="idx">${i+1}</span><span class="nm"></span>`+
                   (i===idx?`<i class="fa-solid fa-volume-high" style="font-size:11px;color:#22d3ee"></i>`:"");
      li.querySelector(".nm").textContent=t.title;
      li.addEventListener("click",()=>{ load(i,true); });
      listEl.appendChild(li);
    });
  }
  // 载入某首（play=true 则立即播放）
  function load(i,play){
    if(!playlist.length){                       // 空库：显示占位，不设 src
      idx=0; titleEl.textContent="音乐库为空"; subEl.textContent="上传作品后自动上架";
      audio.removeAttribute("src"); renderList(); return;
    }
    idx=(i+playlist.length)%playlist.length;
    const t=playlist[idx];
    titleEl.textContent=t.title;
    subEl.textContent=t.artist||"";
    audio.src=t.src;
    renderList();
    seek.value=0; seek.style.setProperty("--pct","0%"); curEl.textContent="0:00"; durEl.textContent="0:00";
    if(play){ audio.play().then(()=>{}).catch(()=>{ /* 自动播放被拦截或源不可用：等用户手动点 */ }); }
  }
  // 供异步解析后替换整份歌单并刷新界面（不打断正在播放的曲目）
  function setPlaylist(tracks){
    playlist = Array.isArray(tracks) ? tracks : [];
    const wasPlaying = !audio.paused && !!audio.currentTime;
    if(!wasPlaying){ idx=0; load(0,false); }    // 未在播放：载入第一首（不自动播）
    else { renderList(); }                        // 正在播放：保持当前曲，只刷新列表
  }
  // 播放/暂停
  function togglePlay(){
    if(!audio.src) load(idx,true);
    else if(audio.paused) audio.play().catch(()=>showToast("该曲目无法播放，请检查音乐源","alert-triangle"));
    else audio.pause();
  }
  toggle.addEventListener("click",togglePlay);
  prevBtn.addEventListener("click",()=>load(idx-1,!audio.paused||!!audio.currentTime));
  nextBtn.addEventListener("click",()=>load(idx+1,true));

  // 播放状态 → 图标 / 封面旋转 / FAB 均衡器动画
  audio.addEventListener("play",()=>{ errCount=0; toggleIcon.className="fa-solid fa-pause"; cover.classList.add("spinning"); player.classList.add("playing"); });
  audio.addEventListener("pause",()=>{ toggleIcon.className="fa-solid fa-play"; cover.classList.remove("spinning"); player.classList.remove("playing"); });
  // 循环：最后一首播完自动回到第一首
  audio.addEventListener("ended",()=>{ errCount=0; load(idx+1,true); });
  // 源不可用 → 自动跳下一首（连续失败超过歌单长度则停止，避免死循环）
  audio.addEventListener("error",()=>{
    if(!audio.getAttribute("src")) return;      // 无 src 的空库状态不处理
    subEl.textContent="源不可用，已跳过";
    if(++errCount <= playlist.length){ load(idx+1,true); }
    else { subEl.textContent="暂无可播放的曲目"; errCount=0; }
  });

  // 进度更新
  audio.addEventListener("loadedmetadata",()=>{ durEl.textContent=fmt(audio.duration); });
  audio.addEventListener("timeupdate",()=>{
    if(seeking||!audio.duration) return;
    const pct=audio.currentTime/audio.duration*100;
    seek.value=Math.round(pct*10);          // 0-1000
    seek.style.setProperty("--pct",pct+"%");
    curEl.textContent=fmt(audio.currentTime);
  });
  // 拖动进度条跳转
  seek.addEventListener("input",()=>{ seeking=true; seek.style.setProperty("--pct",(seek.value/10)+"%"); });
  seek.addEventListener("change",()=>{
    if(audio.duration) audio.currentTime=(seek.value/1000)*audio.duration;
    seeking=false;
  });

  // 音量
  function applyVol(){
    audio.volume=parseFloat(vol.value);
    vol.style.setProperty("--vpct",(vol.value*100)+"%");
    const v=audio.volume;
    volIcon.innerHTML = v===0 ? '<i class="fa-solid fa-volume-xmark"></i>'
                      : v<0.5 ? '<i class="fa-solid fa-volume-low"></i>'
                              : '<i class="fa-solid fa-volume-high"></i>';
  }
  vol.addEventListener("input",applyVol);
  applyVol();

  // 展开/收起列表
  function toggleList(){
    const open=player.classList.toggle("open");
    head.setAttribute("aria-expanded",open?"true":"false");
  }
  head.addEventListener("click",toggleList);
  head.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleList();} });

  // 展开/收起整个播放面板（FAB ↔ 面板）
  function expand(){ player.classList.add("expanded"); fab.setAttribute("aria-expanded","true"); }
  function collapse(){ player.classList.remove("expanded","open"); fab.setAttribute("aria-expanded","false"); head.setAttribute("aria-expanded","false"); fab.focus(); }
  // 点击右下角悬浮按钮：直接展开面板并开始播放（用户手势内触发，绕过自动播放限制）
  fab.addEventListener("click",()=>{
    expand();
    if(!playlist.length){ showToast("音乐库为空，上传作品后即可播放","music"); return; }
    if(!audio.getAttribute("src")) load(idx,true);      // 尚未载入源：载入当前曲并播放
    else if(audio.paused) audio.play().catch(()=>showToast("点击面板里的 ▶ 开始播放","music"));
  });
  collapseBtn.addEventListener("click",collapse);
  // 点击播放器外部：先收起列表，若列表已收则收起整个面板
  document.addEventListener("click",e=>{
    if(player.contains(e.target)) return;
    if(player.classList.contains("open")){ player.classList.remove("open"); head.setAttribute("aria-expanded","false"); }
    else if(player.classList.contains("expanded")){ collapse(); }
  });
  // Esc 收起
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&player.classList.contains("expanded")) collapse(); });

  // 初始化：先用兜底列表载入第一首（不自动播放），随后异步解析真实歌单
  load(0,false);

  // 暴露给「音乐作品」入口卡片：展开面板 + 打开列表 + 播放（当前曲或第一首）
  window.__player = {
    open(){ expand(); if(!player.classList.contains("open")) toggleList(); },
    play(){
      expand();
      if(!player.classList.contains("open")) toggleList();
      if(!playlist.length){ showToast("音乐库为空，上传作品后即可播放","music"); return; }
      if(!audio.getAttribute("src")) load(idx,true);
      else if(audio.paused) audio.play().catch(()=>showToast("点击播放器里的 ▶ 开始播放","music"));
    }
  };

  // 异步解析音乐库：GitHub API → music.json → 内置兜底，取到即替换
  (async ()=>{
    subEl.textContent = "正在载入音乐库…";
    try{
      let tracks = null;
      try{ tracks = await fetchFromGitHub(); }catch(e){ /* API 失败/超限，尝试清单 */ }
      if(!tracks || !tracks.length){
        try{ tracks = await fetchFromManifest(); }catch(e){ /* 清单缺失，用兜底 */ }
      }
      if(tracks && tracks.length){ setPlaylist(tracks); }
      else { setPlaylist(fallbackPlaylist); }   // 都没有 → 保留内置示例
    }catch(e){
      setPlaylist(fallbackPlaylist);
    }
  })();
})();

/* ================= 🎮 游戏库 + 入口卡片交互 ================= */
/* 与音乐同源：把游戏放进仓库的 games/ 子文件夹（含 index.html），部署后自动列出。
   加载优先级：GitHub API 列 games/ 子目录 → games/games.json → 空状态。 */
const GAMES_DIR = "games";
/* 目录名 → 友好游戏名：连字符/下划线转空格，首字母大写 */
function prettyGameName(s){
  return decodeURIComponent(s).replace(/[-_]+/g," ").replace(/\.(html?|)$/i,"").trim()
    .replace(/\b\w/g,c=>c.toUpperCase());
}
/* 通过 GitHub API 列出 games/ 下的子目录(每个=一个游戏，入口 index.html)与单个 .html 文件 */
async function fetchGamesFromGitHub(){
  const gh = detectGitHubRepo && detectGitHubRepo();
  if(!gh) return null;
  const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${GAMES_DIR}?ref=${MUSIC_CONFIG.branch}`;
  const res = await fetch(url,{ headers:{ "Accept":"application/vnd.github+json" } });
  if(!res.ok) throw new Error("GitHub API "+res.status);
  const items = await res.json();
  if(!Array.isArray(items)) return null;
  const games = [];
  for(const it of items){
    if(it.type==="dir"){
      games.push({ title:prettyGameName(it.name), desc:"网页游戏", url:`${GAMES_DIR}/${encodeURIComponent(it.name)}/index.html`, cover:"" });
    } else if(it.type==="file" && /\.html?$/i.test(it.name) && !/^readme/i.test(it.name)){
      games.push({ title:prettyGameName(it.name), desc:"网页游戏", url:`${GAMES_DIR}/${encodeURIComponent(it.name)}`, cover:"" });
    }
  }
  return games.sort((a,b)=>a.title.localeCompare(b.title,"zh"));
}
/* 读取 games/games.json 清单 */
async function fetchGamesFromManifest(){
  const res = await fetch(`${GAMES_DIR}/games.json`,{ cache:"no-store" });
  if(!res.ok) throw new Error("manifest "+res.status);
  const data = await res.json();
  const arr = Array.isArray(data) ? data : (data.games||[]);
  if(!arr.length) return null;
  return arr.map(g=>({
    title: g.title || prettyGameName(g.url||"游戏"),
    desc:  g.desc || "网页游戏",
    url:   /^(https?:)?\/\//.test(g.url) ? g.url : `${GAMES_DIR}/${g.url}`,
    cover: g.cover || ""
  }));
}

(function initGames(){
  const modal=$("#gmModal"), listEl=$("#gmList");
  if(!modal||!listEl) return;
  const backdrop=$("#gmBackdrop"), closeBtn=$("#gmClose"), subEl=$("#gmSub");
  let games=null, loading=false, lastFocus=null;

  function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  function renderGames(){
    listEl.innerHTML="";
    if(!games || !games.length){
      const li=document.createElement("li");
      li.className="gm-empty";
      li.innerHTML=`<i class="fa-solid fa-ghost"></i>游戏库还是空的～<br>把网页小游戏放进仓库的 <code>games/</code> 文件夹并 push，这里就会自动出现。`;
      listEl.appendChild(li);
      return;
    }
    games.forEach(g=>{
      const li=document.createElement("li");
      const a=document.createElement("a");
      a.className="gm-item"; a.href=g.url; a.target="_blank"; a.rel="noopener";
      const cover = g.cover ? `background-image:url('${esc(g.cover)}')` : "";
      a.innerHTML=`
        <div class="gm-cover" style="${cover}"><span class="gm-play"><i class="fa-solid fa-circle-play"></i></span></div>
        <div class="gm-info"><div class="gm-name">${esc(g.title)}</div><div class="gm-desc">${esc(g.desc)}</div></div>`;
      li.appendChild(a); listEl.appendChild(li);
    });
  }

  async function ensureLoaded(){
    if(games || loading) return;
    loading=true;
    subEl.textContent="正在载入游戏库…";
    renderGames();                                   // 先渲染占位
    try{
      let list=null;
      try{ list=await fetchGamesFromGitHub(); }catch(e){}
      if(!list || !list.length){ try{ list=await fetchGamesFromManifest(); }catch(e){} }
      games = list || [];
    }catch(e){ games=[]; }
    loading=false;
    subEl.textContent = games.length ? "点开即玩 · 作品持续加入中" : "作品持续加入中";
    renderGames();
  }

  function open(){
    lastFocus=document.activeElement;
    modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    closeBtn.focus();
    ensureLoaded();
  }
  function close(){
    modal.classList.remove("open"); modal.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  backdrop.addEventListener("click",close);
  closeBtn.addEventListener("click",close);
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&modal.classList.contains("open")) close(); });

  // 入口卡片点击：音乐 → 展开播放器并播放；游戏 → 打开选择弹窗
  document.addEventListener("click",e=>{
    const card=e.target.closest("[data-gal]");
    if(!card) return;
    const action=card.getAttribute("data-gal");
    if(action==="music"){ window.__player?.play(); }
    else if(action==="game"){ open(); }
  });
})();

/* ================= 高级感增强模块（参考 liuhao.online：点+圈光标 / 磁性按钮 / 卡片光斑 / 装饰环视差） =================
   全部为渐进增强：具备精确指针(鼠标)且未开启减动效时才启用；触摸设备与 reduce-motion 场景自动跳过，保留系统光标。 */
const _finePointer = matchMedia("(hover:hover) and (pointer:fine)").matches;
const _reduceMotion = matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---- 1) 自定义鼠标光标：实心小点精确跟随 + 空心外圈缓动(lerp)延迟跟随 ---- */
(function initCursor(){
  if(!_finePointer || _reduceMotion) return;              // 触摸 / 减动效：使用系统光标
  const dot=$("#cursorDot"), ring=$("#cursorRing");
  if(!dot||!ring) return;
  document.documentElement.classList.add("cursor-on");    // 隐藏系统光标（CSS）
  let mx=innerWidth/2, my=innerHeight/2;                   // 目标（真实鼠标）坐标
  let rx=mx, ry=my;                                        // 外圈当前坐标（缓动逼近）
  let raf=null, moved=false;
  function frame(){
    // 外圈以 lerp 缓动追赶鼠标，形成「圈滞后于点」的高级质感
    rx += (mx-rx)*0.18; ry += (my-ry)*0.18;
    dot.style.transform  = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    raf = requestAnimationFrame(frame);
  }
  addEventListener("mousemove",e=>{
    mx=e.clientX; my=e.clientY;
    if(!moved){ moved=true; dot.classList.remove("hidden"); ring.classList.remove("hidden"); }
    if(!raf) frame();
  },{passive:true});
  // 移出窗口淡出，回到窗口恢复
  document.addEventListener("mouseleave",()=>{ dot.classList.add("hidden"); ring.classList.add("hidden"); });
  document.addEventListener("mouseenter",()=>{ dot.classList.remove("hidden"); ring.classList.remove("hidden"); });
  // 按下 / 松开：外圈收缩反馈
  addEventListener("mousedown",()=>{ dot.classList.add("down"); ring.classList.add("down"); });
  addEventListener("mouseup",  ()=>{ dot.classList.remove("down"); ring.classList.remove("down"); });
  // 悬停可交互元素：外圈放大染色（事件委托，覆盖动态渲染的内容）
  const interactiveSel = 'a,button,input,textarea,select,label,[role="button"],.copy-btn,.chip,.scroll-icon,[data-full],.nav-btn,.svc-card,.glass-photo';
  document.addEventListener("mouseover",e=>{ if(e.target.closest(interactiveSel)){ dot.classList.add("hover"); ring.classList.add("hover"); } });
  document.addEventListener("mouseout", e=>{ if(e.target.closest(interactiveSel)){ dot.classList.remove("hover"); ring.classList.remove("hover"); } });
})();

/* ---- 2) 磁性按钮：鼠标靠近时按钮朝光标轻微位移，离开复位（仅精确指针 & 非减动效） ---- */
(function initMagnetic(){
  if(!_finePointer || _reduceMotion) return;
  const STRENGTH=0.32;                                   // 吸附强度（0~1）
  function bind(node){
    node.style.transition = node.style.transition || "transform .25s cubic-bezier(.2,.8,.2,1)";
    node.addEventListener("mousemove",e=>{
      const r=node.getBoundingClientRect();
      const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
      node.style.transform=`translate(${dx*STRENGTH}px,${dy*STRENGTH}px)`;
    });
    node.addEventListener("mouseleave",()=>{ node.style.transform="translate(0,0)"; });
  }
  // 主要 CTA：打个招呼、复制按钮、项目外链、打印按钮、点赞
  document.querySelectorAll("#helloBtn,#printBtn,.copy-btn,#likeBtn").forEach(bind);
})();

/* ---- 3) 卡片鼠标光斑跟随：写入 --sx/--sy(卡片内坐标) 与 --sp(悬停=1)，配合 ::after 光晕 ---- */
(function initSpotlight(){
  if(!_finePointer) return;                              // 光斑仅在鼠标设备生效
  document.querySelectorAll(".glass").forEach(card=>{
    card.addEventListener("mousemove",e=>{
      const r=card.getBoundingClientRect();
      card.style.setProperty("--sx",(e.clientX-r.left)+"px");
      card.style.setProperty("--sy",(e.clientY-r.top)+"px");
      card.style.setProperty("--sp","1");
    });
    card.addEventListener("mouseleave",()=>card.style.setProperty("--sp","0"));
  });
})();

/* ---- 4) 装饰同心圆环：随滚动做轻微视差位移，增强纵深（减动效时保持静止） ---- */
(function initRingsParallax(){
  const rings=$("#decoRings"); if(!rings || _reduceMotion) return;
  let ticking=false;
  addEventListener("scroll",()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      const shift = Math.min(120, scrollY*0.08);
      rings.style.transform = `translateY(calc(-50% + ${shift}px))`;
      ticking=false;
    });
  },{passive:true});
})();

onScroll();
</script>
