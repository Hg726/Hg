            if (keys[' '] && player.alive) {
                const shots = player.shoot();
                if (shots) bullets.push(...shots);
            }
        }

        function checkItemPickup() {
            const allTanks = [player, ...enemies].filter(t => t && t.alive);
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                // 补给类道具（维修包/护盾）仅玩家可拾取，敌人碰到会穿过
                const isSupply = (item.type === ITEM_TYPE.HEAL || item.type === ITEM_TYPE.SHIELD);
                for (let tank of allTanks) {
                    if (isSupply && !tank.isPlayer) continue;
                    if (rectCollide(tank.getRect(), item.getRect())) {
                        if (item.type === ITEM_TYPE.HEAL) {
                            // 维修包：生命 +1，封顶 HELL_MAX_LIVES
                            lives = Math.min(lives + 1, HELL_MAX_LIVES);
                            updateHUD();
                            createExplosion(item.x + item.size/2, item.y + item.size/2, WEAPON_META[ITEM_TYPE.HEAL].color);
                            showMenuToast('✚ 维修包：生命 +1');
                        } else if (item.type === ITEM_TYPE.SHIELD) {
                            // 护盾：5 秒免伤
                            player.shieldTime = SHIELD_DURATION;
                            createExplosion(item.x + item.size/2, item.y + item.size/2, WEAPON_META[ITEM_TYPE.SHIELD].color);
                            showMenuToast('⛨ 获得护盾（5 秒）');
                        } else {
                            // 敌我均可拾取，限时生效，新武器覆盖旧武器
                            tank.setWeapon(item.type);
                            const meta = WEAPON_META[item.type];
                            createExplosion(item.x + item.size/2, item.y + item.size/2, meta ? meta.color : '#00f0ff');
                            if (tank.isPlayer) showWeaponToast(item.type);
                        }
                        items.splice(i, 1);
                        break;
                    }
                }
            }
        }

        // 玩家拾取武器时的画面提示
        function showWeaponToast(type) {
            const meta = WEAPON_META[type];
            if (!meta) return;
            showMenuToast(`${meta.icon} 获得武器：${meta.name}`);
        }

        // ========== 主循环 ==========
        function update() {
            if (gameState !== 'playing') return;
            handlePlayerInput();
            updateEnemies();
            for (let bullet of bullets) {
                if (bullet.alive) bullet.update();
            }
            bullets = bullets.filter(b => b.alive);
            for (let item of items) item.floatPhase += 0.05;
            if (player && player.shieldTime > 0) player.shieldTime--; // 护盾倒计时
            checkItemPickup();
            updateWeaponHud();
            updateParticles();
            if (enemiesAlive <= 0) victory();
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            // 游戏界面背景：优先使用 浪尖1.jpg，未加载完成时回退为深色底
            if (gameBgReady) {
                ctx.drawImage(gameBgImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                // 叠加半透明暗色遮罩，保证坦克、子弹清晰可辨
                ctx.fillStyle = 'rgba(10, 10, 20, 0.3)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            } else {
                ctx.fillStyle = CYBER.bg;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            ctx.strokeStyle = CYBER.grid;
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x=0; x<=CANVAS_WIDTH; x+=gridSize) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CANVAS_HEIGHT); ctx.stroke();
            }
            for (let y=0; y<=CANVAS_HEIGHT; y+=gridSize) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CANVAS_WIDTH,y); ctx.stroke();
            }
            for (let wall of walls) wall.draw(ctx);
            for (let item of items) item.draw(ctx);
            if (player.alive) player.draw(ctx);
            for (let enemy of enemies) enemy.draw(ctx);
            for (let bullet of bullets) bullet.draw(ctx);
            drawParticles(ctx);
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // ========== 主菜单动态赛博战场背景 ==========
        let menuBgId = null;
        let menuBgTime = 0;
        let menuTanks = [];
        let menuParticles = [];

        function initMenuScene() {
            // 随机布置若干缓慢巡逻的坦克剪影
            menuTanks = [];
            const palette = ['#05ffa1', '#f9f871', '#00f0ff', '#ff2a6d', '#ff00ff'];
            const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
            for (let i = 0; i < 7; i++) {
                menuTanks.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    dir: dirs[Math.floor(Math.random() * dirs.length)],
                    speed: 0.3 + Math.random() * 0.6,
                    size: 26 + Math.random() * 18,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }
            // 漂浮的流光粒子
            menuParticles = [];
            for (let i = 0; i < 40; i++) {
                menuParticles.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    vy: -(0.2 + Math.random() * 0.6),
                    size: Math.random() * 2 + 1,
                    color: Math.random() < 0.5 ? '#00f0ff' : '#ff00ff',
                    alpha: 0.2 + Math.random() * 0.5
                });
            }
        }

        function drawMenuTankSilhouette(g, t) {
            const s = t.size, half = s / 2;
            const isV = (t.dir === DIR.UP || t.dir === DIR.DOWN);
            g.save();
            g.globalAlpha = 0.5;
            g.shadowColor = t.color;
            g.shadowBlur = 14;
            const track = s * 0.22;
            // 履带
            g.fillStyle = 'rgba(15,15,25,0.9)';
            if (isV) {
                g.fillRect(t.x, t.y, track, s);
                g.fillRect(t.x + s - track, t.y, track, s);
            } else {
                g.fillRect(t.x, t.y, s, track);
                g.fillRect(t.x, t.y + s - track, s, track);
            }
            // 机体
            const inset = track;
            g.fillStyle = t.color;
            g.fillRect(t.x + inset, t.y + inset, s - inset * 2, s - inset * 2);
            // 炮塔
            g.fillStyle = '#0d0d14';
            g.beginPath();
            g.arc(t.x + half, t.y + half, s * 0.16, 0, Math.PI * 2);
            g.fill();
            // 炮管
            g.fillStyle = t.color;
            const bl = s * 0.42, bw = s * 0.12, cx = t.x + half, cy = t.y + half;
            switch (t.dir) {
                case DIR.UP:    g.fillRect(cx - bw/2, t.y - bl + inset, bw, bl); break;
                case DIR.DOWN:  g.fillRect(cx - bw/2, t.y + s - inset, bw, bl); break;
                case DIR.LEFT:  g.fillRect(t.x - bl + inset, cy - bw/2, bl, bw); break;
                case DIR.RIGHT: g.fillRect(t.x + s - inset, cy - bw/2, bl, bw); break;
            }
            g.restore();
        }

        function renderMenuBackground() {
            menuBgTime += 1;
            const g = ctx;
            // 深色底 + 径向光晕
            g.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const grd = g.createRadialGradient(
                CANVAS_WIDTH/2, CANVAS_HEIGHT*0.45, 60,
                CANVAS_WIDTH/2, CANVAS_HEIGHT*0.45, CANVAS_WIDTH*0.7
            );
            grd.addColorStop(0, '#141426');
            grd.addColorStop(1, '#08080e');
            g.fillStyle = grd;
            g.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 滚动霓虹网格（向下流动，营造纵深）
            const gridSize = 40;
            const offset = (menuBgTime * 0.5) % gridSize;
            g.lineWidth = 1;
            g.strokeStyle = 'rgba(0,240,255,0.10)';
            for (let x = 0; x <= CANVAS_WIDTH; x += gridSize) {
                g.beginPath(); g.moveTo(x, 0); g.lineTo(x, CANVAS_HEIGHT); g.stroke();
            }
            for (let y = -gridSize; y <= CANVAS_HEIGHT; y += gridSize) {
                g.beginPath(); g.moveTo(0, y + offset); g.lineTo(CANVAS_WIDTH, y + offset); g.stroke();
            }

            // 巡逻坦克剪影
            for (const t of menuTanks) {
                switch (t.dir) {
                    case DIR.UP: t.y -= t.speed; break;
                    case DIR.DOWN: t.y += t.speed; break;
                    case DIR.LEFT: t.x -= t.speed; break;
                    case DIR.RIGHT: t.x += t.speed; break;
                }
                // 出界回绕 + 偶尔换向
                if (t.x < -t.size) t.x = CANVAS_WIDTH;
                if (t.x > CANVAS_WIDTH) t.x = -t.size;
                if (t.y < -t.size) t.y = CANVAS_HEIGHT;
                if (t.y > CANVAS_HEIGHT) t.y = -t.size;
                if (Math.random() < 0.004) {
                    const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
                    t.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }
                drawMenuTankSilhouette(g, t);
            }

            // 流光粒子
            for (const p of menuParticles) {
                p.y += p.vy;
                if (p.y < -4) { p.y = CANVAS_HEIGHT + 4; p.x = Math.random() * CANVAS_WIDTH; }
                g.save();
                g.globalAlpha = p.alpha;
                g.fillStyle = p.color;
                g.shadowColor = p.color;
                g.shadowBlur = 8;
                g.fillRect(p.x, p.y, p.size, p.size);
                g.restore();
            }

            // 顶部扫描线
            const scanY = (menuBgTime * 1.5) % CANVAS_HEIGHT;
            g.save();
            g.globalAlpha = 0.08;
            g.fillStyle = '#00f0ff';
            g.fillRect(0, scanY, CANVAS_WIDTH, 3);
            g.restore();

            menuBgId = requestAnimationFrame(renderMenuBackground);
        }

        function startMenuBackground() {
            if (menuBgId) return; // 已在运行
            initMenuScene();
            renderMenuBackground();
        }

        function stopMenuBackground() {
            if (menuBgId) { cancelAnimationFrame(menuBgId); menuBgId = null; }
        }

        // ========== 启动游戏 ==========
        function initGame() {
            showMainMenu();
            initTankIcons();
            // 默认不预选坦克：玩家必须自行选择后才能进入难度/开始
            updateDifficultyBtnState();
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            mainMenu.addEventListener('click', (e) => {
                if (e.target === mainMenu) {
                    tankSubmenu.style.display = 'none';
                    difficultySubmenu.style.display = 'none';
                }
            });
        }

        initGame();
    </script>
